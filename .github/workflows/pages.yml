name: Deploy stock radar to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # 12:30 UTC = 20:30 Asia/Shanghai. Exchange calendar decides holidays.
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      refresh_after_close:
        description: '交易日盘后核验当日更新并选股；休市不扫描，不使用旧日期'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate after-close screening rules
        run: |
          python3 -m unittest discover -s tests -v
          node --check static/app.js
          node tests/test_frontend.cjs
      - name: Check scheduled trading day
        id: session
        run: |
          python3 - <<'PYCODE'
          import os
          from datetime import datetime
          from radar.engine import CHINA
          from radar.market import trading_day, calendar_data
          active = trading_day(datetime.now(CHINA).date(), calendar_data()) is True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('active=' + str(active).lower() + '\n')
          PYCODE
      - name: Wait for dated daily data and scan once
        if: steps.session.outputs.active == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_after_close))
        run: |
          set +e
          python3 scripts/scan_after_close.py --workers 8 --readiness-attempts 6
          scan_exit=$?
          set -e
          if [ "$scan_exit" -ne 0 ] && [ "$scan_exit" -ne 2 ]; then
            exit "$scan_exit"
          fi
      - name: Persist dated snapshot for once-per-day scan
        if: steps.session.outputs.active == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_after_close))
        run: |
          if ! git diff --quiet -- static/results.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add static/results.json
            git commit -m "Update dated after-close stock radar snapshot"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare and verify publication directory
        run: python3 scripts/build_site.py --output "$RUNNER_TEMP/stock-radar-site" --commit "$(git rev-parse HEAD)"
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/stock-radar-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
