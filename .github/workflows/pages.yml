name: Deploy stock radar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_history:
        description: '使用免费源扫描沪深京历史候选（与正式入选分开）'
        type: boolean
        default: false
      refresh_data:
        description: '扫描真实数据后部署（接口不完整时发布无法判断诊断）'
        type: boolean
        default: false
      symbols:
        description: '六位A股代码，逗号分隔；留空请求全A股。建议先少量验证。'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate strict screening rules
        run: |
          python3 -m unittest discover -s tests -v
          node --check static/app.js
          node tests/test_frontend.cjs
      - name: Collect real data
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_data
        env:
          SCAN_SYMBOLS: ${{ inputs.symbols }}
        run: |
          set +e
          if [ -n "$SCAN_SYMBOLS" ]; then
            python3 scripts/scan.py --preflight --symbols "$SCAN_SYMBOLS"
          else
            python3 scripts/scan.py --preflight
          fi
          scan_exit=$?
          set -e
          if [ "$scan_exit" -ne 0 ] && [ "$scan_exit" -ne 2 ]; then
            exit "$scan_exit"
          fi
          if [ "$scan_exit" -eq 2 ]; then
            echo "真实数据不完整；部署诊断页面，不宣称筛选成功。"
          fi
      - name: Collect full-market historical candidates
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_history
        run: |
          set +e
          python3 scripts/scan_history_market.py --workers 8
          scan_exit=$?
          set -e
          if [ "$scan_exit" -ne 0 ] && [ "$scan_exit" -ne 2 ]; then
            exit "$scan_exit"
          fi
          if [ "$scan_exit" -eq 2 ]; then
            echo "历史扫描未完整覆盖；发布实际进度和失败原因，不宣称全市场筛选完成。"
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare and verify publication directory
        run: python3 scripts/build_site.py --output "$RUNNER_TEMP/stock-radar-site" --commit "$GITHUB_SHA"
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/stock-radar-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
