name: Validate small-sample after-close data
on:
  workflow_dispatch:
    inputs:
      selection_date:
        description: '可选：明确指定已完成交易日核验；留空只接受当日盘后'
        type: string
        default: ''
permissions:
  contents: read
  checks: write
jobs:
  connectivity:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify dated after-close data on main-board stocks
        env:
          SELECTION_DATE: ${{ inputs.selection_date }}
        run: |
          set +e
          if [ -n "$SELECTION_DATE" ]; then
            python3 scripts/scan_after_close.py --date "$SELECTION_DATE" --symbols 600519,000001,600036 --output "$RUNNER_TEMP/sample-report.json"
          else
            python3 scripts/scan_after_close.py --symbols 600519,000001,600036 --output "$RUNNER_TEMP/sample-report.json"
          fi
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ "$result" -ne 2 ]; then exit "$result"; fi
      - name: Record dated diagnostic evidence
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/sample-report.json', 'utf8'));
            const evidence = Object.fromEntries(['schemaVersion','screeningMode','selectionDate','state','message','complete','scannedCount','counts','errors','readinessProbes','stocks'].map(key => [key,report[key]]));
            await github.rest.checks.create({owner:context.repo.owner,repo:context.repo.repo,head_sha:context.sha,
              name:'Small-sample after-close data evidence',status:'completed',conclusion:'neutral',
              output:{title:'Dated after-close diagnostic only; no intraday scanning',
                summary:'```json\n'+JSON.stringify(evidence,null,2)+'\n```'}});
