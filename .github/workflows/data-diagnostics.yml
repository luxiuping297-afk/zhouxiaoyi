name: Validate small-sample data connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  connectivity:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose three actual stocks without scanning the market
        run: python3 scripts/diagnose_network.py --context github-runner --output "$RUNNER_TEMP/network-report.json"
      - name: Validate the five conditions on three actual stocks
        run: |
          set +e
          python3 scripts/scan.py --symbols 600519,000001,300750 --workers 3 --output "$RUNNER_TEMP/sample-report.json"
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ "$result" -ne 2 ]; then exit "$result"; fi
      - name: Record diagnostic evidence
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/network-report.json', 'utf8'));
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha,
              name: 'Small-sample data connectivity evidence', status: 'completed', conclusion: 'neutral',
              output: {title: 'Connectivity checks only; live screening not verified',
                summary: '```json\n' + JSON.stringify(report, null, 2) + '\n```'}
            });
            const sample = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/sample-report.json', 'utf8'));
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha,
              name: 'Three-stock screening chain evidence', status: 'completed', conclusion: 'neutral',
              output: {title: sample.liveChainVerified ? 'Five-condition chain available' : 'Necessary data unavailable; market scan withheld',
                summary: '```json\n' + JSON.stringify(sample, null, 2) + '\n```'}
            });
